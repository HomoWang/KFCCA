<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KFC 優惠券查詢</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>KFC 優惠券查詢</h1>
        <p id="last-updated">資料更新中</p>
      </div>
    </header>

    <main>
      <nav class="view-tabs" aria-label="主要功能">
        <button class="tab-button active" type="button" data-view-tab="coupons">優惠券清單</button>
        <button class="tab-button" type="button" data-view-tab="calculator">最划算計算</button>
      </nav>

      <section id="coupons-view" data-view-panel="coupons">
        <section class="toolbar" aria-label="優惠券篩選">
          <input id="search" type="search" placeholder="肯德基 最新優惠碼 代碼 快速搜尋" />
          <input id="max-price" type="number" min="0" placeholder="最高金額" />
          <select id="sort">
            <option value="endDateAsc">期限 近到遠</option>
            <option value="endDateDesc">期限 遠到近</option>
            <option value="priceAsc">金額 低到高</option>
            <option value="priceDesc">金額 高到低</option>
          </select>
        </section>

        <section class="filter-panel" aria-label="品項篩選">
          <div id="item-filters" class="filter-chips"></div>
          <button id="clear-item-filters" class="ghost-button" type="button">清除篩選</button>
        </section>

        <div class="section-title">
          <h2>優惠券清單</h2>
          <span id="coupon-count"></span>
        </div>
        <div id="coupon-list" class="coupon-grid"></div>
      </section>

      <section id="calculator-view" class="calculator hidden" data-view-panel="calculator">
        <div class="section-title">
          <h2>最划算購買方式計算器</h2>
        </div>
        <div class="person-control">
          <label for="person-count">人數</label>
          <input id="person-count" type="number" min="1" max="10" value="2" />
          <button id="build-people" type="button">產生需求</button>
        </div>
        <div id="people-forms" class="people-forms"></div>
        <button id="calculate" class="primary" type="button">計算最划算組合</button>
        <div id="result" class="result" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
