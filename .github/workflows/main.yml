name: Update coupons

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-coupons
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update coupon data
        env:
          COUPON_RANGES: ${{ vars.COUPON_RANGES }}
          CHECK_RANGES: ${{ vars.CHECK_RANGES }}
          KFC_OFFICIAL_API_URL: ${{ secrets.KFC_OFFICIAL_API_URL }}
          KFC_OFFICIAL_API_METHOD: ${{ vars.KFC_OFFICIAL_API_METHOD || 'POST' }}
          KFC_API_TIMEOUT: "20"
          KFC_API_RETRIES: "2"
          KFC_API_SLEEP: "0.8"
        run: python script/kfc.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coupon data"
          file_pattern: public/coupon.json public/coupon.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
