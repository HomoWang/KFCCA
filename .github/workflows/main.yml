name: Update coupons

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/**"
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-coupons
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update coupon data
        env:
          COUPON_RANGES: ${{ vars.COUPON_RANGES }}
          CHECK_RANGES: ${{ vars.CHECK_RANGES }}
          KFC_OFFICIAL_API_URL: ${{ secrets.KFC_OFFICIAL_API_URL }}
          KFC_GET_EVOUCHER_URL: ${{ vars.KFC_GET_EVOUCHER_URL || secrets.KFC_OFFICIAL_API_URL }}
          KFC_CHECK_COUPON_PRODUCT_URL: ${{ vars.KFC_CHECK_COUPON_PRODUCT_URL }}
          KFC_QUERY_FOOD_DETAIL_URL: ${{ vars.KFC_QUERY_FOOD_DETAIL_URL }}
          KFC_SHOP_CODE: ${{ vars.KFC_SHOP_CODE || 'TWI104' }}
          KFC_MAX_CANDIDATES: ${{ vars.KFC_MAX_CANDIDATES }}
          KFC_OFFICIAL_API_METHOD: ${{ vars.KFC_OFFICIAL_API_METHOD || 'POST' }}
          KFC_API_TIMEOUT: "20"
          KFC_API_RETRIES: "2"
          KFC_API_SLEEP: "0.8"
        run: python script/kfc.py

      - name: Update menu data
        env:
          KFC_QUERY_FOOD_DETAIL_URL: ${{ vars.KFC_QUERY_FOOD_DETAIL_URL }}
          KFC_SHOP_CODE: ${{ vars.KFC_SHOP_CODE || 'TWI104' }}
          KFC_API_TIMEOUT: "20"
          KFC_API_RETRIES: "2"
          KFC_API_SLEEP: "0.8"
        run: python script/menu.py

      - name: Validate coupon data and calculator logic
        run: node --test

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coupon data"
          file_pattern: public/coupon.json public/product-history.json public/menu.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
